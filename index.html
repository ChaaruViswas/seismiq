<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Seismiq — change-aware test intelligence and CI reliability. Test impact analysis, flaky-test detection, failure clustering and culprit ranking, running entirely in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Seismiq — change-aware test intelligence</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('seismiq:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
